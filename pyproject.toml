[project]
name = "order-intake"
version = "0.1.0"
description = "AI-assisted order intake for a B2B office-supplies distributor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "pypdf>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# This is an application, not a library: don't try to build/install the project
# itself, just manage its dependencies.
package = false
